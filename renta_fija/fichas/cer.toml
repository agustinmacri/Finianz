# Fichas técnicas de los bonos y letras ajustados por CER que no pagan intereses ni amortizaciones.
#
# Cada [[bono]] tiene los datos de su norma de emisión:
#   ticker       ticker en BYMA (en pesos)
#   tipo         BONCER, LECER o DUAL CER/TAMAR
#   familia      cer_cero_cupon: paga el capital ajustado por CER al vencimiento
#   emision      fecha de emisión (liquidación inicial)
#   vencimiento  fecha de pago del capital
#   cer_inicial  base: CER del décimo día hábil anterior a la liquidación inicial (fijo aunque haya reaperturas)
#   revisado     true si Agustin lo validó (contra su Excel o la norma)
#   fuente       de dónde salió el dato
#   nota         opcional: aclaraciones
#
# Las definiciones de cada variable están en docs/convenciones-renta-fija.md.
# Después de editar este archivo no hace falta correr nada: se lee en cada cálculo.

