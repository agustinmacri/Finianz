# Fichas técnicas de los bonos a tasa TAMAR capitalizables y de la pata TAMAR de los duales.
#
# Cada [[bono]] tiene los datos de su norma de emisión:
#   ticker       ticker en BYMA (en pesos)
#   tipo         BONO TAMAR, DUAL TAMAR/TASA FIJA o DUAL CER/TAMAR
#   familia      tamar_capitalizable: capitaliza la TEM y paga todo al vencimiento
#   emision      fecha de emisión (liquidación inicial). La ventana de la TAMAR empieza 10 días hábiles antes
#   vencimiento  fecha de pago. La ventana de la TAMAR termina 10 días hábiles antes
#   margen       margen anual sobre la TAMAR (0.065 = 6,5%); 0 si no tiene
#   revisado     true si Agustin lo validó
#   fuente       de dónde salió el dato
#   nota         opcional: aclaraciones
#
# Un dual puede tener ficha acá y en otro archivo (ej.: los TXM también están en cer.toml):
# la calculadora muestra el bono calculado de las dos formas.
# Las definiciones de cada variable están en docs/convenciones-renta-fija.md.

[[bono]]
ticker = "TTD26"
tipo = "DUAL TAMAR/TASA FIJA"
familia = "tamar_capitalizable"
emision = 2025-01-29
vencimiento = 2026-12-15
margen = 0.0
revisado = true
fuente = "Planilla de TAMAR de Agustin (ejemplo_tamar.xlsx), 13/11/2026"
nota = "Dual: al vencimiento paga la pata que dé el mayor pago final (tasa fija con cupón 2,14% o TAMAR). Se muestra calculado de las dos formas."

