# Fichas técnicas de los bonos ajustados por CER que pagan cupón y amortizan.
#
# Cada [[bono]] tiene los datos de su norma de emisión:
#   ticker       ticker en BYMA (en pesos)
#   tipo         BONCER
#   familia      cer_cupon
#   emision      fecha de emisión (liquidación inicial). El CER inicial (base) es el del décimo día hábil
#                anterior: se toma de la base de series (datos/series.db), no se carga acá.
#   vencimiento  fecha del último pago
#   cupon        tasa anual (0.0225 = 2,25%)
#   frecuencia   pagos por año (2 = semestral)
#   base         base de cálculo del interés corrido (hoy: 30/360)
#   pagos        cronograma completo: fecha de cada pago (sin correr por feriados) y amortización
#                en % del valor nominal original (0 si ese pago es solo cupón). Tiene que sumar 100.
#   revisado     true si Agustin lo validó
#   fuente       de dónde salió el dato
#
# Las definiciones de cada variable están en docs/convenciones-renta-fija.md.

[[bono]]
ticker = "TX28"
tipo = "BONCER"
familia = "cer_cupon"
emision = 2020-09-04
vencimiento = 2028-11-09
cupon = 0.0225
frecuencia = 2
base = "30/360"
revisado = true
fuente = "Excel de Agustin (ejemplo_tx28.xlsx), 13/11/2026"
