# Fichas técnicas de los bonos dollar linked (valor nominal en dólares, pagaderos en pesos).
#
# Cada [[bono]] tiene los datos de su norma de emisión:
#   ticker            ticker en BYMA (cotiza en pesos por 100 VN en dólares)
#   tipo              LETRA DL o BONO DL
#   familia           dolar_linked_bullet: paga todo al vencimiento
#   emision           fecha de emisión
#   vencimiento       fecha de pago
#   tipo_cambio_pago  opcional: tipo de cambio con el que se paga, según el prospecto (A3500, BNA vendedor
#                     o un promedio de días). Informativo: en dólares, el bullet paga 100
#   revisado          true si Agustin lo validó
#   fuente            de dónde salió el dato
#
# Las definiciones de cada variable están en docs/convenciones-renta-fija.md.

