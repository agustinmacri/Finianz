# Fichas técnicas de los bonos y letras a tasa fija en pesos.
#
# Capitalizables (familia tasa_fija_capitalizable: Lecap "S", Boncap "T"):
#   emision, vencimiento, cupon (cupón de licitación: tasa mensual capitalizable, la TEM de emisión). El pago final se calcula:
#   100 × (1 + cupon) ^ (días 30/360 entre emisión y vencimiento / 30).
#
# Con cupón (familia tasa_fija_cupon: Bonte): como los CER con cupón, sin cer_inicial
#   (cupon, frecuencia, base y el cronograma de pagos, que tiene que sumar 100 de amortización).
#
# Hoy los datos vienen de la planilla de Agustin; más adelante van a salir de los prospectos.
# Las definiciones de cada variable están en docs/convenciones-renta-fija.md.

