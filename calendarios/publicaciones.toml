# Catálogo de publicaciones que sigue Finianz.
#
# Cada [[publicacion]] define una publicación con su importancia y de dónde sale su fecha:
#   codigo       identificador corto, único (se usa para buscar: "¿cuándo sale el próximo IPC?")
#   nombre       cómo se muestra
#   pais         AR o US
#   organismo    quién la publica
#   importancia  alta, media o baja (los agentes muestran por defecto alta y media)
#   fuente       indec_pdf: calendario semestral del INDEC (calendarios/indec/)
#                fred:      API de FRED (necesita FRED_API_KEY en el .env)
#                manual:    fechas cargadas a mano (próximamente)
#                regla:     se calcula con días hábiles, ej. "primer día hábil del mes"
#   patron       solo para indec_pdf: comienzo del título tal como aparece en el PDF
#   fred_release solo para fred: nombre exacto de la publicación en FRED (fred.stlouisfed.org/releases)
#   dia_habil, calendario, excluir, periodo: solo para regla (ver carga_datos/publicaciones_regla.py)
#   hora         opcional: hora habitual de publicación (ej.: "08:30 ET", hora del este de EE. UU.)
#
# Las publicaciones del INDEC que NO están en este catálogo también se guardan, con importancia baja.
# Después de editar este archivo, corré:  python actualizar.py

